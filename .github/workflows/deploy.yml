# Generated by byob-deploy. Commit to .github/workflows/deploy.yml.
# Auth is GitHub OIDC — no AWS access keys are stored in this repo.
name: Deploy (byob)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::092370681715:role/pwa-production-deploy-role
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        run: |
          docker build -t 092370681715.dkr.ecr.eu-west-2.amazonaws.com/pwa-production:${{ github.sha }} .
          docker push 092370681715.dkr.ecr.eu-west-2.amazonaws.com/pwa-production:${{ github.sha }}

      - name: Deploy on host via SSM
        run: |
          aws ssm send-command \
            --region eu-west-2 \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:byob:stem,Values=pwa-production" \
            --comment "byob deploy ${{ github.sha }}" \
            --parameters commands='["/opt/byob/pwa-production/deploy.sh 092370681715.dkr.ecr.eu-west-2.amazonaws.com/pwa-production:${{ github.sha }}"]'
